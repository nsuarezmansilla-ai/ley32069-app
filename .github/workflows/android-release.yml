name: 2. Compilar nueva versión Android (Google Play)
# Genera el APK y el AAB firmados. El AAB se sube a Google Play Console.
on:
  workflow_dispatch:
    inputs:
      version:
        description: 'Número de versión visible (ej. 1.1)'
        required: true
        default: '1.1'
jobs:
  android:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 22
      - uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: 21
      - name: Preparar proyecto
        run: |
          npm ci
          npx cap sync android
      - name: Llave de firma
        env:
          KEYSTORE_BASE64: ${{ secrets.ANDROID_KEYSTORE_BASE64 }}
          KEYSTORE_PASSWORD: ${{ secrets.ANDROID_KEYSTORE_PASSWORD }}
        run: |
          echo "$KEYSTORE_BASE64" | base64 --decode > android/ley32069-release.jks
          printf "storeFile=../ley32069-release.jks\nstorePassword=%s\nkeyAlias=ley32069\nkeyPassword=%s\n" "$KEYSTORE_PASSWORD" "$KEYSTORE_PASSWORD" > android/keystore.properties
      - name: Compilar
        env:
          VERSION_CODE: ${{ github.run_number }}
          VERSION_NAME: ${{ inputs.version }}
        run: |
          cd android
          # versionCode debe crecer siempre: se usa 100 + número de ejecución
          export VERSION_CODE=$((100 + VERSION_CODE))
          ./gradlew assembleRelease bundleRelease --no-daemon
      - uses: actions/upload-artifact@v4
        with:
          name: Ley32069-${{ inputs.version }}
          path: |
            android/app/build/outputs/apk/release/app-release.apk
            android/app/build/outputs/bundle/release/app-release.aab
