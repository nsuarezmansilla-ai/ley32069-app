name: 1. Actualizar textos de la Ley y el Reglamento
# Sube los PDF nuevos a la carpeta fuentes/ (con los nombres ley.pdf y reglamento.pdf)
# y luego ejecuta esta acción desde la pestaña Actions > Run workflow.
on:
  workflow_dispatch:
    inputs:
      fecha:
        description: 'Fecha de actualización de los textos (ej. 15/12/2026)'
        required: true
      notas:
        description: 'Qué cambió (opcional, lo verán los usuarios)'
        required: false
        default: ''
permissions:
  contents: write
  pages: write
  id-token: write
concurrency:
  group: pages
  cancel-in-progress: false
jobs:
  actualizar:
    runs-on: ubuntu-latest
    environment:
      name: github-pages
      url: ${{ steps.deploy.outputs.page_url }}
    steps:
      - uses: actions/checkout@v4
      - name: Instalar pdftotext
        run: sudo apt-get update -qq && sudo apt-get install -y -qq poppler-utils
      - name: Extraer artículos de los PDF
        run: python3 herramientas/extraer.py fuentes/ley.pdf fuentes/reglamento.pdf datos
      - name: Preparar datos para la app
        env:
          UPDATE_BASE: https://${{ github.repository_owner }}.github.io/${{ github.event.repository.name }}/datos/
        run: python3 herramientas/publicar_datos.py datos sitio "${{ inputs.fecha }}" "${{ inputs.notas }}"
      - name: Guardar los datos nuevos en el repositorio
        run: |
          git config user.name "github-actions"
          git config user.email "github-actions@users.noreply.github.com"
          git add datos www/data.js
          git commit -m "Textos actualizados al ${{ inputs.fecha }}" || echo "Sin cambios"
          git push
      - uses: actions/configure-pages@v5
      - uses: actions/upload-pages-artifact@v3
        with:
          path: sitio
      - id: deploy
        uses: actions/deploy-pages@v4
